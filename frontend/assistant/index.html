<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>J.A.R.V.I.S.</title>
  <link rel="stylesheet" href="assistant.css">
  <script src="orb.js" defer></script>
  <script src="assistant.js" defer></script>
</head>
<body>
  <main class="stage" aria-label="자비스">
    <header class="presence">
      <span id="presenceDot" class="presence-dot" aria-hidden="true"></span>
      <span id="presenceText">준비됨</span>
    </header>

    <section class="core" aria-live="polite">
      <canvas id="orb" class="orb" role="img" aria-label="자비스 상태 표시"></canvas>
      <p id="caption" class="caption">무엇을 도와드릴까요?</p>
      <p id="reply" class="reply" hidden></p>
    </section>

    <section class="dock" aria-label="자비스에게 말하기">
      <div id="suggestions" class="suggestions">
        <button type="button" data-prompt="오늘 일정 알려줘">오늘 일정</button>
        <button type="button" data-prompt="안 읽은 메일 요약해줘">메일 요약</button>
        <button type="button" data-prompt="내 노트에서 지난주 회의 결정 찾아줘">내 노트에서 찾기</button>
      </div>
      <form id="composer" class="composer">
        <label class="sr-only" for="input">자비스에게 메시지</label>
        <input id="input" type="text" maxlength="2000" autocomplete="off" placeholder="말하거나 입력하세요">
        <button id="mic" class="mic" type="button" aria-pressed="false" aria-label="말로 입력">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-2.07A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
        <button id="send" class="send" type="submit" aria-label="보내기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></svg>
        </button>
      </form>
      <p class="hint">Space를 길게 누르면 듣고, Esc로 멈춰요.</p>
    </section>

    <a class="dev-link" href="/" title="연결, 직원, 실행 기록">개발자 화면</a>
  </main>
</body>
</html>
