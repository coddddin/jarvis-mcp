name: Jarvis issue triage (read only)

on:
  issues:
    types: [opened, edited, labeled, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-triage-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.user.login == 'coddddin'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted repository source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate classifier
        run: python -m unittest discover -s tests -p 'test_github_triage_unittest.py' -v
      - name: Classify event (advisory only)
        if: github.event_name == 'issues'
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: python -m jarvis.cli.github_triage "$EVENT_PATH"
