# The same checks every agent runs by hand before a merge (docs/DEVELOPMENT.md).
# Windows, because JARVIS runs on Windows and several tests use Windows paths and APIs.
# Tests that need a GPU, Ollama or local models skip themselves when those are missing.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Architecture
        run: python scripts/check_architecture.py
      - name: Docs
        run: python scripts/check_docs.py
      - name: Python tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Frontend tests
        shell: bash
        run: node --test tests/frontend/*.cjs
